name: Extract project ZIP
on:
  push:
    paths:
      - ".github/extract-trigger.txt"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract source files without overwriting existing files
        run: |
          mkdir -p /tmp/habitos
          unzip -o habitos-codigo-fuente.zip -d /tmp/habitos
          cp -rn /tmp/habitos/. .
          rm -f .github/extract-trigger.txt .github/workflows/extract-zip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract habit tracker source files"
            git push
          fi
